<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fair Catan Boards</title>

    <!-- <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script> -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/mowwis/align-ui@latest/dist/align.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="flex flex--center">

    <main class="flex-col flex--center">
        <header class="flex-col items-center">
            <button class="btn" id="trigger">
                <h1>Generate Fair Board</h1>
            </button>
            <p>Click to create balanced Catan maps for fun play.</p>
        </header>

        <div id="board-wrapper" class="flex-col flex--center hide-stats">
            <div id="board" class="flex-col flex--center"></div>
            <div id="overlay" class="flex-col flex--center"></div>

            <menu class="flex items-center">
                <button class="btn btn--icon" id="toggle-settings" title="Settings for Generation"><i
                        class="fa-solid fa-gear"></i></button>
                <button class="btn btn--icon" id="toggle-stats" title="Toggle Board Statistics"><i
                        class="fa-solid fa-chart-simple"></i></button>
            </menu>

            <div id="stats" class="flex flex--center">
                <div class="lumber flex flex--center">?</div>
                <div class="wool flex flex--center">?</div>
                <div class="grain flex flex--center">?</div>
                <div class="ore flex flex--center">?</div>
                <div class="brick flex flex--center">?</div>
            </div>
        </div>

        <div id="dice" class="flex flex--center" title="Roll Dice">
            <div class="d3"></div>
            <div class="d6"></div>
            <button id="dice-reset" class="btn btn--icon btn--ghost" title="Reset Dice"><i
                    class='fas fa-redo'></i></button>
        </div>

        <dialog id="settings-menu">
            <header class="flex items-center">
                <h1>Board Rules</h1>
                <form method="dialog">
                    <button class="btn btn--icon btn--ghost"><i class="fa-solid fa-xmark"></i></button>
                </form>
            </header>
            <div class="content flex-col"></div>
            <p><i class="fa-solid fa-circle-info"></i>
                It may still be possible that generated boards violate the desired rules.</p>
        </dialog>

        <!-- <div id="chart-container"
            style="width: 100%; max-width: 600px; padding: 20px; border: 1px solid #000; border-radius: 12px;">
            <h3>Optimization History (Loss)</h3>
            <div style="height: 300px; width: 100%;"><canvas id="lossChart"></canvas></div>
            <div id="loss-info" style="font-family: monospace; font-size: 13px; font-weight:bold"></div>
        </div> -->
    </main>

    <template id="tile-template">
        <div class="tile flex-col flex--center">
            <div class="hex"></div>
            <div class="token flex flex--center"></div>
        </div>
    </template>

     <script type="module" src="js/app.js"></script>
</body>

</html>
